<!DOCTYPE html>
<html>
<head>
    <title>Register - Digital Logbook</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Create an Account</h1>
    
    <form action="/register" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="password">Password:</label>
        <div class="password-container" style="margin-bottom: 5px;">
            <input type="password" id="password" name="password" 
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&]).{8,}" 
                   title="Must contain at least 8 characters, including 1 uppercase, 1 lowercase, 1 number, and 1 special character." 
                   required>
            <span class="toggle-password" title="Show/Hide Password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </span>
        </div>
        
        <ul id="password-requirements" class="password-reqs">
            <li id="req-length" class="invalid">At least 8 characters</li>
            <li id="req-lower" class="invalid">One lowercase letter (a-z)</li>
            <li id="req-upper" class="invalid">One uppercase letter (A-Z)</li>
            <li id="req-number" class="invalid">One number (0-9)</li>
            <li id="req-special" class="invalid">One special character (@$!%*?&)</li>
        </ul>
        
        <button type="submit">Register Account</button>
    </form>

    <br><br>
    <a href="/login" class="secondary-btn">Already have an account? Login</a>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
